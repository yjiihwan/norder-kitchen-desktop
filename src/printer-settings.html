<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프린터 설정 — N오더 주방</title>
<style>
  :root { --rose: #FF0065; --line: #e6e6ea; --muted: #7a7a85; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "AppleSDGothicNeo", "Malgun Gothic", sans-serif;
         background: #f7f7f9; color: #1c1c24; font-size: 14px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  label.radio { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 8px; cursor: pointer; }
  label.radio:hover { background: #faf7f8; }
  label.radio b { font-weight: 700; }
  label.radio .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .field-row { display: flex; gap: 8px; align-items: center; margin: 8px 0 0 26px; flex-wrap: wrap; }
  input[type=text], input[type=number], select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; }
  input[name=ip] { width: 160px; } input[name=port] { width: 90px; }
  select { min-width: 240px; max-width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--rose); color: #fff; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 16px;
         font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { background: #faf7f8; }
  .btn--cta { background: var(--rose); border-color: var(--rose); color: #fff; }
  .btn--cta:hover { background: #e00059; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: #0a7d33; } .msg.err { color: #c81e3c; }
  .toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .field-row .lbl { color: var(--muted); font-size: 12.5px; }
  select.sm { min-width: 0; }
  .hint { margin: 8px 0 0 26px; font-size: 12px; color: #9a5b00; background: #fff6e5; border-radius: 8px; padding: 6px 10px; }
  .hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖨 프린터 설정</h1>
  <p class="sub">배달 주문을 수락하면 이 설정으로 주문서가 자동 인쇄돼요.</p>

  <div class="card">
    <h2>연결 방식</h2>
    <label class="radio"><input type="radio" name="mode" value="network">
      <span><b>네트워크 프린터 (권장)</b> — ESC/POS 감열, IP:9100 직접 전송
        <div class="desc">주방 감열 프린터를 유선랜/와이파이로 연결한 경우. 가장 빠르고 안정적이에요.</div>
        <div class="field-row">
          <input type="text" name="ip" placeholder="예: 192.168.0.50" data-testid="ps-ip">
          <input type="number" name="port" value="9100" data-testid="ps-port">
        </div>
      </span></label>
    <label class="radio"><input type="radio" name="mode" value="usbraw">
      <span><b>USB 프린터</b> — 윈도우에 설치된 프린터 큐로 ESC/POS 직접 전송(RAW)
        <div class="desc">USB 감열 프린터를 제조사 드라이버로 설치한 경우. 아래에서 프린터를 고르세요.</div>
        <div class="field-row"><select name="usbPrinter" data-testid="ps-usb-printer"></select></div>
      </span></label>
    <label class="radio"><input type="radio" name="mode" value="serial" data-testid="ps-mode-serial">
      <span><b>COM 단자 프린터</b> — PC 뒤 넓은 9핀 단자(COM)로 연결된 프린터에 직접 전송
        <div class="desc">배달앱(쿠팡이츠 등)에서 «COM2» 처럼 단자를 골라 쓰는 프린터예요. 배달앱과 같은 단자·속도로 맞춰 주세요. 인쇄할 때만 단자를 잠깐 열고 바로 닫아서 배달앱과 같이 쓸 수 있어요.</div>
        <div class="field-row">
          <select name="comPath" data-testid="ps-com-path"></select>
          <span class="lbl">속도</span>
          <select name="comBaud" class="sm" data-testid="ps-com-baud">
            <option value="9600">9600</option><option value="19200">19200</option><option value="38400">38400</option>
            <option value="57600">57600</option><option value="115200">115200</option>
          </select>
        </div>
        <div class="field-row">
          <span class="lbl">데이터</span>
          <select name="comDataBits" class="sm" data-testid="ps-com-databits"><option value="8">8</option><option value="7">7</option></select>
          <span class="lbl">패리티</span>
          <select name="comParity" class="sm" data-testid="ps-com-parity">
            <option value="none">없음</option><option value="even">짝수</option><option value="odd">홀수</option></select>
          <span class="lbl">정지</span>
          <select name="comStopBits" class="sm" data-testid="ps-com-stopbits"><option value="1">1</option><option value="2">2</option></select>
        </div>
        <div class="field-row">
          <span class="lbl">흐름제어</span>
          <select name="comFlow" class="sm" data-testid="ps-com-flow">
            <option value="none">없음</option><option value="dsrdtr">DTR/DSR</option>
            <option value="rtscts">RTS/CTS</option><option value="xonxoff">XON/XOFF</option></select>
        </div>
        <div class="desc" style="margin-left:26px">모르면 «8 · 없음 · 1 · 흐름제어 없음»(보통 8N1)으로 두세요.</div>
        <div class="hint" id="comRasterHint" data-testid="ps-com-raster-hint" hidden>COM 단자는 전송 속도가 느려요. 아래 «인쇄 방식»은 <b>텍스트 인쇄</b>를 권장해요. 이미지 인쇄는 한 장에 1분 넘게 걸리고, 그동안 배달앱 인쇄가 막혀요.</div>
      </span></label>
    <label class="radio"><input type="radio" name="mode" value="system">
      <span><b>일반 인쇄 (다른 방식이 안 될 때)</b> — ESC/POS 미지원 프린터를 OS 드라이버로 인쇄
        <div class="desc">감열 전용 명령을 지원하지 않는 프린터용. 이미지 방식이라 조금 느려요.</div>
        <div class="field-row"><select name="sysPrinter" data-testid="ps-sys-printer"></select></div>
      </span></label>
    <label class="radio"><input type="radio" name="mode" value="preview">
      <span><b>미리보기 (테스트)</b> — 인쇄 대신 주문서 이미지를 화면에 띄움
        <div class="desc">프린터 연결 전 레이아웃 확인용이에요.</div>
      </span></label>
    <label class="radio"><input type="radio" name="mode" value="off">
      <span><b>끄기</b> — 자동 인쇄 안 함</span></label>
  </div>

  <div class="card">
    <h2>인쇄 방식 <span style="font-weight:400;color:var(--muted)">(네트워크·USB·COM 공통)</span></h2>
    <label class="radio"><input type="radio" name="escposOutput" value="raster" data-testid="ps-out-raster">
      <span><b>이미지 인쇄 (기본 — 모든 기종 호환)</b>
        <div class="desc">주문서를 이미지로 변환해 보내요. 프린터의 한글 지원 여부·제조사와 관계없이 어떤 ESC/POS 감열 프린터든 똑같이 나와요. 기종을 모르면 이걸 쓰세요.</div>
      </span></label>
    <label class="radio"><input type="radio" name="escposOutput" value="text" data-testid="ps-out-text">
      <span><b>텍스트 인쇄 (한글 지원 기종 전용 — 빠름)</b>
        <div class="desc">한글(CP949)을 프린터에 직접 보내요. 한글 펌웨어 내장 기종(국산 등)에서만 정상이에요. 한글이 깨져 나오면 «이미지 인쇄»로 바꾸세요. 꺾쇠 따옴표·악센트 글자는 비슷한 글자로 바꾸고, 이모지는 빼고 인쇄해요.</div>
      </span></label>
  </div>

  <div class="card row">
    <h2 style="margin:0">용지 폭</h2>
    <span class="seg" data-testid="ps-width">
      <button type="button" data-w="80">80mm</button>
      <button type="button" data-w="58">58mm</button>
    </span>
  </div>

  <div class="card row">
    <h2 style="margin:0">주문 수락 시 자동 인쇄</h2>
    <label class="toggle"><input type="checkbox" name="autoPrint" data-testid="ps-auto"> 켜기</label>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">주문 수락당 인쇄 매수</h2>
      <span class="seg" data-testid="ps-copies">
        <button type="button" data-c="1">1매</button>
        <button type="button" data-c="2">2매</button>
        <button type="button" data-c="3">3매</button>
        <button type="button" data-c="4">4매</button>
        <button type="button" data-c="5">5매</button>
      </span>
    </div>
    <div style="color:var(--muted);font-size:12px;margin-top:8px">
      수락 시 자동 인쇄와 [주문서 재인쇄] 버튼 모두 설정한 매수만큼 출력돼요. (예: 주방용·홀용 2매)
    </div>
  </div>

  <div class="btns">
    <button class="btn btn--cta" id="save" data-testid="ps-save">저장</button>
    <button class="btn" id="test" data-testid="ps-test">테스트 인쇄</button>
    <button class="btn" id="preview" data-testid="ps-preview">미리보기</button>
  </div>
  <p class="msg" id="msg" data-testid="ps-msg"></p>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let widthMm = 80;
  let copies = 1;

  function currentForm() {
    return {
      mode: document.querySelector('input[name=mode]:checked')?.value || "preview",
      ip: $('input[name=ip]').value.trim(),
      port: Number($('input[name=port]').value) || 9100,
      osPrinterName:
        (document.querySelector('input[name=mode]:checked')?.value === "system"
          ? $('select[name=sysPrinter]').value
          : $('select[name=usbPrinter]').value) || "",
      widthMm,
      autoPrint: $('input[name=autoPrint]').checked,
      copies,
      escposOutput: document.querySelector('input[name=escposOutput]:checked')?.value || 'raster',
      comPath: $('select[name=comPath]').value || '',
      comBaud: Number($('select[name=comBaud]').value) || 9600,
      comDataBits: Number($('select[name=comDataBits]').value) || 8,
      comParity: $('select[name=comParity]').value || 'none',
      comStopBits: Number($('select[name=comStopBits]').value) || 1,
      comFlow: $('select[name=comFlow]').value || 'none',
    };
  }

  function paintComHint() {
    const serial = document.querySelector('input[name=mode]:checked')?.value === 'serial';
    const raster = document.querySelector('input[name=escposOutput]:checked')?.value !== 'text';
    $('#comRasterHint').hidden = !(serial && raster);
  }

  function fillComPorts(comPorts, saved) {
    const { detected = [], manual = [] } = comPorts || {};
    const opt = (p) => `<option value="${esc(p.path)}">${esc(p.label || p.path)}</option>`;
    let html = '<option value="">COM 단자를 선택하세요</option>';
    if (detected.length) html += `<optgroup label="이 PC에서 찾은 단자">${detected.map(opt).join('')}</optgroup>`;
    const rest = manual.slice();
    if (saved && ![...detected, ...rest].some((p) => p.path === saved)) rest.unshift({ path: saved, label: saved + ' (저장된 단자)' });
    if (rest.length) html += `<optgroup label="${detected.length ? '직접 선택' : '단자 목록을 읽지 못했어요 — 직접 선택'}">${rest.map(opt).join('')}</optgroup>`;
    $('select[name=comPath]').innerHTML = html;
    $('select[name=comPath]').value = saved || '';
  }

  function setMsg(text, ok) {
    const el = $('#msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function paintWidth() {
    document.querySelectorAll('.seg [data-w]').forEach((b) =>
      b.classList.toggle('on', Number(b.dataset.w) === widthMm));
  }

  function paintCopies() {
    document.querySelectorAll('.seg [data-c]').forEach((b) =>
      b.classList.toggle('on', Number(b.dataset.c) === copies));
  }

  window.norderPS.getState().then(({ printer, osPrinters, comPorts }) => {
    const opts = osPrinters.map((p) =>
      `<option value="${esc(p.name)}">${esc(p.displayName || p.name)}${p.isDefault ? " (기본)" : ""}</option>`);
    const empty = '<option value="">프린터를 선택하세요</option>';
    $('select[name=usbPrinter]').innerHTML = empty + opts.join('');
    $('select[name=sysPrinter]').innerHTML = empty + opts.join('');
    document.querySelector(`input[name=mode][value=${printer.mode}]`).checked = true;
    $('input[name=ip]').value = printer.ip || '';
    $('input[name=port]').value = printer.port || 9100;
    if (printer.osPrinterName) {
      $('select[name=usbPrinter]').value = printer.osPrinterName;
      $('select[name=sysPrinter]').value = printer.osPrinterName;
    }
    document.querySelector(
      `input[name=escposOutput][value=${printer.escposOutput === 'text' ? 'text' : 'raster'}]`).checked = true;
    widthMm = Number(printer.widthMm) === 58 ? 58 : 80;
    $('input[name=autoPrint]').checked = printer.autoPrint !== false;
    copies = Math.min(5, Math.max(1, Math.trunc(Number(printer.copies) || 1)));
    fillComPorts(comPorts, printer.comPath || '');
    $('select[name=comBaud]').value = String(printer.comBaud || 9600);
    $('select[name=comDataBits]').value = String(printer.comDataBits || 8);
    $('select[name=comParity]').value = printer.comParity || 'none';
    $('select[name=comStopBits]').value = String(printer.comStopBits || 1);
    $('select[name=comFlow]').value = printer.comFlow || 'none';
    paintWidth();
    paintCopies();
    paintComHint();
  });

  // COM 을 고르면 텍스트 인쇄로 바꿔 둔다(느린 단자에서 배달앱 인쇄를 오래 막지 않게). 다시 바꿀 수 있다.
  document.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', () => {
    if (r.checked && r.value === 'serial') document.querySelector('input[name=escposOutput][value=text]').checked = true;
    paintComHint();
  }));
  document.querySelectorAll('input[name=escposOutput]').forEach((r) => r.addEventListener('change', paintComHint));

  document.querySelectorAll('.seg [data-w]').forEach((b) =>
    b.addEventListener('click', () => { widthMm = Number(b.dataset.w); paintWidth(); }));
  document.querySelectorAll('.seg [data-c]').forEach((b) =>
    b.addEventListener('click', () => { copies = Number(b.dataset.c); paintCopies(); }));

  $('#save').addEventListener('click', async () => {
    const f = currentForm();
    await window.norderPS.save(f);
    setMsg(f.mode === 'off' || !f.autoPrint
      ? '저장됐어요. 자동 인쇄는 꺼져 있어요.'
      : '저장됐어요. 이제 주문을 수락하면 이 설정으로 인쇄돼요.', true);
  });
  $('#test').addEventListener('click', async () => {
    const f = currentForm();
    setMsg('테스트 주문서를 보내는 중…', true);
    const r = await window.norderPS.testPrint(f);
    const done = f.mode === 'preview' ? '미리보기 이미지를 열었어요.' : '테스트 주문서를 보냈어요. 출력물을 확인해 주세요.';
    setMsg(r.ok ? done : (r.error || '실패했어요.'), r.ok);
  });
  $('#preview').addEventListener('click', async () => {
    const r = await window.norderPS.preview(currentForm());
    setMsg(r.ok ? '미리보기 이미지를 열었어요.' : (r.error || '실패했어요.'), r.ok);
  });
</script>
</body>
</html>
