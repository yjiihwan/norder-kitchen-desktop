<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프린터 설정 — N오더 주방</title>
<style>
  :root { --rose: #FF0065; --line: #e6e6ea; --muted: #7a7a85; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "AppleSDGothicNeo", "Malgun Gothic", sans-serif;
         background: #f7f7f9; color: #1c1c24; font-size: 14px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  input[type=text], input[type=number], select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
  select.big { width: 100%; padding: 11px 12px; font-size: 15px; }
  input[name=ip] { width: 180px; } input[name=port] { width: 90px; }
  .field-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .field-row[hidden] { display: none; }
  .lbl { color: var(--muted); font-size: 12.5px; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .desc:empty { display: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--rose); color: #fff; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .btns { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 16px;
         font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { background: #faf7f8; }
  .btn--cta { background: var(--rose); border-color: var(--rose); color: #fff; }
  .btn--cta:hover { background: #e00059; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: #0a7d33; } .msg.err { color: #c81e3c; }
  .toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  details.adv { margin-top: 4px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 2px; user-select: none; }
  details.adv .card { margin-top: 6px; }
  .adv h3 { font-size: 13px; margin: 0 0 6px; }
  .adv section + section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .adv label.chk { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖨 프린터 설정</h1>
  <p class="sub">프린터만 고르면 끝이에요. 배달 주문을 수락하면 주문서가 자동 인쇄돼요.</p>

  <div class="card">
    <h2>프린터 선택</h2>
    <select name="printer" class="big" data-testid="ps-printer"></select>
    <div class="field-row" id="netRow" hidden>
      <span class="lbl">IP 주소</span>
      <input type="text" name="ip" placeholder="예: 192.168.0.50" data-testid="ps-ip">
      <span class="lbl">포트</span>
      <input type="number" name="port" value="9100" data-testid="ps-port">
    </div>
    <div class="desc" id="pickDesc" data-testid="ps-pick-desc"></div>
  </div>

  <div class="card row">
    <h2 style="margin:0">용지 폭</h2>
    <span class="seg" data-testid="ps-width">
      <button type="button" data-w="80">80mm</button>
      <button type="button" data-w="58">58mm</button>
    </span>
  </div>

  <div class="card row">
    <h2 style="margin:0">주문 수락당 인쇄 매수</h2>
    <span class="seg" data-testid="ps-copies">
      <button type="button" data-c="1">1매</button>
      <button type="button" data-c="2">2매</button>
      <button type="button" data-c="3">3매</button>
      <button type="button" data-c="4">4매</button>
      <button type="button" data-c="5">5매</button>
    </span>
  </div>

  <div class="card row">
    <h2 style="margin:0">주문 수락 시 자동 인쇄</h2>
    <label class="toggle"><input type="checkbox" name="autoPrint" data-testid="ps-auto"> 켜기</label>
  </div>

  <div class="btns">
    <button class="btn btn--cta" id="test" data-testid="ps-test">테스트 인쇄</button>
  </div>
  <p class="msg" id="msg" data-testid="ps-msg"></p>

  <details class="adv" id="adv" data-testid="ps-advanced">
    <summary data-testid="ps-advanced-toggle">고급 설정 (보통은 안 바꿔도 돼요)</summary>
    <div class="card">
      <section>
        <h3>COM 단자 통신 설정</h3>
        <div class="field-row" style="margin-top:0">
          <span class="lbl">속도</span>
          <select name="comBaud" data-testid="ps-com-baud">
            <option value="9600">9600</option><option value="19200">19200</option><option value="38400">38400</option>
            <option value="57600">57600</option><option value="115200">115200</option>
          </select>
          <span class="lbl">데이터</span>
          <select name="comDataBits" data-testid="ps-com-databits"><option value="8">8</option><option value="7">7</option></select>
          <span class="lbl">패리티</span>
          <select name="comParity" data-testid="ps-com-parity">
            <option value="none">없음</option><option value="even">짝수</option><option value="odd">홀수</option></select>
        </div>
        <div class="field-row">
          <span class="lbl">정지 비트</span>
          <select name="comStopBits" data-testid="ps-com-stopbits"><option value="1">1</option><option value="2">2</option></select>
          <span class="lbl">흐름제어</span>
          <select name="comFlow" data-testid="ps-com-flow">
            <option value="none">없음</option><option value="dsrdtr">DTR/DSR</option>
            <option value="rtscts">RTS/CTS</option><option value="xonxoff">XON/XOFF</option></select>
        </div>
        <div class="desc">배달앱과 같은 값으로 맞춰 주세요. 모르면 기본값(9600 · 8 · 없음 · 1 · 흐름제어 없음)으로 두세요.</div>
      </section>
      <section>
        <h3>인쇄 방식</h3>
        <select name="outputMode" data-testid="ps-output">
          <option value="auto">자동 (COM 단자는 텍스트, 그 밖은 이미지)</option>
          <option value="raster">이미지 인쇄 — 모든 기종 호환</option>
          <option value="text">텍스트 인쇄 — 한글 지원 기종 전용, 빠름</option>
        </select>
        <div class="desc">한글이 깨져 나오면 «이미지 인쇄»로 바꾸세요.</div>
      </section>
      <section>
        <h3>설치된 프린터 인쇄 경로</h3>
        <label class="chk"><input type="checkbox" name="sysDriver" data-testid="ps-sys-driver">
          <span>윈도우 드라이버로 일반 인쇄하기<div class="desc" style="margin-top:2px">감열 프린터 명령을 지원하지 않는 프린터일 때만 켜세요. 조금 느려요.</div></span></label>
      </section>
    </div>
  </details>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let loaded = {};
  let widthMm = 80;
  let copies = 1;
  let ready = false;

  const autoOutput = (mode) => (mode === 'serial' ? 'text' : 'raster');

  // 저장 구조(mode·osPrinterName·comPath·ip)는 0.4.8 과 같다 — 화면의 «프린터 선택» 한 칸을 그 값들로 펼친다.
  function pickOf(p) {
    if (p.mode === 'usbraw' || p.mode === 'system') return p.osPrinterName ? 'os:' + p.osPrinterName : '';
    if (p.mode === 'serial') return p.comPath ? 'com:' + p.comPath : '';
    if (p.mode === 'network') return 'net';
    if (p.mode === 'off') return 'off';
    return 'preview';
  }

  function fillPrinters(osPrinters, comPorts, p) {
    const opt = (v, label) => `<option value="${esc(v)}">${esc(label)}</option>`;
    const saved = pickOf(p);
    const os = osPrinters.map((x) => ({ v: 'os:' + x.name, label: `${x.displayName || x.name} (설치된 프린터${x.isDefault ? ' · 기본' : ''})` }));
    if (saved.startsWith('os:') && !os.some((o) => o.v === saved)) os.unshift({ v: saved, label: `${p.osPrinterName} (설치된 프린터 · 지금 안 보임)` });
    const { detected = [], manual = [] } = comPorts || {};
    const com = detected.map((x) => ({ v: 'com:' + x.path, label: `${x.path} (직접 연결)` }));
    const comRest = manual.map((x) => ({ v: 'com:' + x.path, label: `${x.path} (직접 연결)` }));
    if (saved.startsWith('com:') && ![...com, ...comRest].some((o) => o.v === saved)) com.unshift({ v: saved, label: `${p.comPath} (직접 연결 · 저장된 단자)` });
    const g = (label, items) => (items.length ? `<optgroup label="${esc(label)}">${items.map((o) => opt(o.v, o.label)).join('')}</optgroup>` : '');
    $('select[name=printer]').innerHTML = opt('', '프린터를 선택하세요')
      + g('이 PC에 설치된 프린터', os)
      + g('COM 단자', com)
      + g(detected.length ? 'COM 단자 — 목록에 없으면 직접 선택' : 'COM 단자 — 직접 선택', comRest)
      + g('네트워크', [{ v: 'net', label: p.ip ? `네트워크 프린터 ${p.ip} (IP 직접 입력)` : '네트워크 프린터 (IP 직접 입력)' }])
      + g('기타', [{ v: 'preview', label: '미리보기 (인쇄하지 않고 화면에 띄우기)' }, { v: 'off', label: '인쇄 안 함 (끄기)' }]);
    $('select[name=printer]').value = saved;
  }

  function currentForm() {
    const pick = $('select[name=printer]').value;
    const f = { ...loaded };
    if (pick.startsWith('os:')) { f.mode = $('input[name=sysDriver]').checked ? 'system' : 'usbraw'; f.osPrinterName = pick.slice(3); }
    else if (pick.startsWith('com:')) { f.mode = 'serial'; f.comPath = pick.slice(4); }
    else if (pick === 'net') f.mode = 'network';
    else if (pick === 'off' || pick === 'preview') f.mode = pick;
    else f.mode = loaded.mode === 'off' ? 'off' : 'preview';
    f.ip = $('input[name=ip]').value.trim();
    f.port = Number($('input[name=port]').value) || 9100;
    f.widthMm = widthMm;
    f.autoPrint = $('input[name=autoPrint]').checked;
    f.copies = copies;
    f.comBaud = Number($('select[name=comBaud]').value) || 9600;
    f.comDataBits = Number($('select[name=comDataBits]').value) || 8;
    f.comParity = $('select[name=comParity]').value || 'none';
    f.comStopBits = Number($('select[name=comStopBits]').value) || 1;
    f.comFlow = $('select[name=comFlow]').value || 'none';
    f.escposOutputMode = $('select[name=outputMode]').value || 'auto';
    f.escposOutput = f.escposOutputMode === 'auto' ? autoOutput(f.mode) : f.escposOutputMode;
    return f;
  }

  function paintPick() {
    const pick = $('select[name=printer]').value;
    $('#netRow').hidden = pick !== 'net';
    $('#pickDesc').textContent =
      pick.startsWith('com:') ? '배달앱(쿠팡이츠 등)과 같은 단자를 같이 써도 돼요. 인쇄할 때만 잠깐 열고 바로 닫아요.'
      : pick === 'net' ? '프린터에 붙은 IP 주소를 넣어 주세요. 포트는 보통 9100이에요.'
      : pick === 'preview' ? '실제 인쇄 대신 주문서 이미지를 화면에 띄워요. 프린터 연결 전 확인용이에요.'
      : pick === 'off' ? '주문을 수락해도 인쇄하지 않아요.'
      : pick === '' ? '목록에서 주방 프린터를 골라 주세요.' : '';
  }

  function setMsg(text, ok) {
    const el = $('#msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function paintWidth() {
    document.querySelectorAll('.seg [data-w]').forEach((b) =>
      b.classList.toggle('on', Number(b.dataset.w) === widthMm));
  }

  function paintCopies() {
    document.querySelectorAll('.seg [data-c]').forEach((b) =>
      b.classList.toggle('on', Number(b.dataset.c) === copies));
  }

  // 저장 버튼 없이 바꿀 때마다 저장 — «고르면 끝». 프린터를 아직 안 골랐으면 기존 설정을 덮지 않는다.
  async function autoSave() {
    if (!ready) return;
    if ($('select[name=printer]').value === '') { setMsg('프린터를 골라 주세요.', false); return; }
    const f = currentForm();
    await window.norderPS.save(f);
    loaded = f;
    setMsg(f.mode === 'off' || !f.autoPrint
      ? '저장됐어요. 자동 인쇄는 꺼져 있어요.'
      : '저장됐어요. 이제 주문을 수락하면 이 프린터로 인쇄돼요.', true);
  }

  window.norderPS.getState().then(({ printer, osPrinters, comPorts }) => {
    loaded = { ...printer };
    fillPrinters(osPrinters, comPorts, printer);
    $('input[name=ip]').value = printer.ip || '';
    $('input[name=port]').value = printer.port || 9100;
    $('input[name=sysDriver]').checked = printer.mode === 'system';
    widthMm = Number(printer.widthMm) === 58 ? 58 : 80;
    $('input[name=autoPrint]').checked = printer.autoPrint !== false;
    copies = Math.min(5, Math.max(1, Math.trunc(Number(printer.copies) || 1)));
    $('select[name=comBaud]').value = String(printer.comBaud || 9600);
    $('select[name=comDataBits]').value = String(printer.comDataBits || 8);
    $('select[name=comParity]').value = printer.comParity || 'none';
    $('select[name=comStopBits]').value = String(printer.comStopBits || 1);
    $('select[name=comFlow]').value = printer.comFlow || 'none';
    // 0.4.8 이하에서 직접 고른 인쇄 방식(예: USB+텍스트)은 «자동»으로 덮지 않고 그대로 이어 간다.
    const out = printer.escposOutput === 'text' ? 'text' : 'raster';
    $('select[name=outputMode]').value = ['auto', 'raster', 'text'].includes(printer.escposOutputMode)
      ? printer.escposOutputMode : (out === autoOutput(printer.mode) ? 'auto' : out);
    paintWidth();
    paintCopies();
    paintPick();
    ready = true;
  });

  $('select[name=printer]').addEventListener('change', () => { paintPick(); autoSave(); });
  document.querySelectorAll('input[name=ip], input[name=port], input[name=autoPrint], input[name=sysDriver], .adv select')
    .forEach((el) => el.addEventListener('change', autoSave));
  document.querySelectorAll('.seg [data-w]').forEach((b) =>
    b.addEventListener('click', () => { widthMm = Number(b.dataset.w); paintWidth(); autoSave(); }));
  document.querySelectorAll('.seg [data-c]').forEach((b) =>
    b.addEventListener('click', () => { copies = Number(b.dataset.c); paintCopies(); autoSave(); }));

  $('#test').addEventListener('click', async () => {
    if ($('select[name=printer]').value === '') { setMsg('먼저 프린터를 골라 주세요.', false); return; }
    const f = currentForm();
    setMsg('테스트 주문서를 보내는 중…', true);
    const r = await window.norderPS.testPrint(f);
    const done = f.mode === 'preview' ? '미리보기 이미지를 열었어요.' : '테스트 주문서를 보냈어요. 출력물을 확인해 주세요.';
    setMsg(r.ok ? done : (r.error || '실패했어요.'), r.ok);
  });
</script>
</body>
</html>
